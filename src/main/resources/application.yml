spring:
  application:
    name: javapp-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    jwt:
      secret: "${JWT_SECRET:}"
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs/openapi
